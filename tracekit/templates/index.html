<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TraceKit</title>
</head>
<body>

    <h1>TraceKit</h1>
    <p>Local public-data reconnaissance toolkit</p>

    <form id="lookup-form">
        <input
            id="target"
            type="text"
            placeholder="example.com"
            required
        >

        <select id="module">
            <option value="domain">Domain</option>
            <option value="web">Website</option>
            <option value="youtube">YouTube</option>
            <option value="username">Username</option>
        </select>

        <button type="submit">Run</button>
    </form>

    <div id="download-buttons" style="display:none; margin-top:15px;">
        <button type="button" id="mp3-button">Download MP3</button>
        <button type="button" id="mp4-button">Download MP4</button>
    </div>

    <pre id="output">Ready.</pre>

    <script>
        const form = document.getElementById("lookup-form");
        const target = document.getElementById("target");
        const module = document.getElementById("module");
        const output = document.getElementById("output");

        const downloadButtons = document.getElementById("download-buttons");
        const mp3Button = document.getElementById("mp3-button");
        const mp4Button = document.getElementById("mp4-button");

        function updateDownloadButtons() {
            downloadButtons.style.display =
                module.value === "youtube" ? "block" : "none";
        }

        module.addEventListener("change", updateDownloadButtons);
        updateDownloadButtons();

        async function downloadYouTube(mode) {
            const url = target.value.trim();

            if (!url) {
                output.textContent = "Enter a YouTube URL first.";
                return;
            }

            output.textContent = `Downloading ${mode.toUpperCase()}...`;

            try {
                const response = await fetch(
                    `/api/youtube/download?target=${encodeURIComponent(url)}&mode=${mode}`
                );

                const data = await response.json();

                output.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                output.textContent = `Error: ${error}`;
            }
        }

        mp3Button.addEventListener("click", () => downloadYouTube("mp3"));
        mp4Button.addEventListener("click", () => downloadYouTube("mp4"));

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            output.textContent = "Running...";

            try {
                const response = await fetch(
                    `/api/${module.value}?target=${encodeURIComponent(target.value)}`
                );

                const data = await response.json();

                output.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                output.textContent = `Error: ${error}`;
            }
        });
    </script>

</body>
</html>
